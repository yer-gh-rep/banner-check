name: Banner Check

on:
  schedule:
    # Every 2 days at 09:00 UTC. Adjust to your team's morning.
    - cron: "0 9 */2 * *"
  workflow_dispatch: {} # adds a manual "Run workflow" button in the GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "banner-check"
  cancel-in-progress: false

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run banner check (screenshots)
        run: npm run check

      - name: Build gallery + prune old runs
        run: npm run gallery

      - name: Commit screenshots + gallery to repo
        run: |
          git config user.name "banner-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add banner-checks
          git commit -m "Banner check: $(date -u +%Y-%m-%d)" || echo "Nothing to commit"
          git push

      - name: Deploy banner-checks/ to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./banner-checks
          destination_dir: banner-checks
          keep_files: false

      - name: Notify Google Chat
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
        run: npm run notify
