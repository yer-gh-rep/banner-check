name: Jotform Mobile Check

on:
  schedule:
    # Every Monday, 09:30 Singapore time (UTC+8) = 01:30 UTC
    - cron: "30 1 * * 1"
  workflow_dispatch: {} # manual "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "jotform-check"
  cancel-in-progress: false

jobs:
  run-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Jotform mobile check
        run: npm run jotform:check

      - name: Prune old runs
        run: npm run jotform:prune

      - name: Commit screenshots to repo
        run: |
          git config user.name "banner-check-bot"
          git config user.email "actions@users.noreply.github.com"
          git add jotform-checks
          git commit -m "Jotform check: $(date -u +%Y-%m-%d)" || echo "Nothing to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push

      # keep_files: false only clears jotform-checks/ on the gh-pages branch
      # (destination_dir), not banner-checks/. It also removes stale files
      # from earlier runs, and old runs are pruned by npm run jotform:prune.
      - name: Deploy jotform-checks/ to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./jotform-checks
          destination_dir: jotform-checks
          keep_files: false

      - name: Notify Google Chat
        if: always()
        env:
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
        run: npm run jotform:notify
